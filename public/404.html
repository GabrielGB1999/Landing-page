      body { margin: 0; min-height: 100vh; display: flex; align-items: center; justify-content: center; padding: 24px; box-sizing: border-box;

      h1 { margin: 0 0 16px; font-weight: 300; font-size: clamp(32px, 6vw, 48px); letter-spacing: -0.02em; }
      p { margin: 0 0 28px; line-height: 1.6; color: #8a97ad; }
      a { display: inline-block; font-family: "IBM Plex Mono", monospace; font-size: 12px; letter-spacing: 0.14em; text-transform: uppercase; text-decoration: none;
        color: #e8ecf3; padding: 12px 24px; border-radius: 8px; border: 1px solid rgba(160,190,230,0.2); }
      a:hover, a:focus-visible { color: #f2b44c; border-color: rgba(242,180,76,0.6); }
    </style>
